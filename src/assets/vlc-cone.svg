<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="coneGrad" x1="50" y1="10" x2="50" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A29" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <filter id="coneGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base platform ellipse -->
