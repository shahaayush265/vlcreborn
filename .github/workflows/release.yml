name: Release v1.0.0 Multi-Platform Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VLC Reborn v${{ github.ref_name }}'
          releaseBody: |
            ## VLC Reborn v${{ github.ref_name }}
            
            Welcome to the official multi-platform release of **VLC Reborn**!
            
            ### Included Assets:
            - **Windows**: `.msi` Windows Installer & `.exe` setup
            - **Linux**: `.deb` Debian package & standalone `.AppImage`
            - **macOS**: Universal `.dmg` Disk Image (Apple Silicon & Intel)
            
            See the [README.md](https://github.com/${{ github.repository }}#readme) for feature highlights and quick-start guides.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android Target
        run: cargo tauri android init || true
        env:
          NDK_HOME: ${{ steps.setup-android.outputs.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Build Android APK
        run: cargo tauri android build --apk || true
        env:
          NDK_HOME: ${{ steps.setup-android.outputs.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vlcreborn-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
